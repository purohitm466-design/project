<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECEEE8">
  <title>Pocket Ledger - Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <h1 class="brand">Pocket Ledger</h1>
      <div class="topbar-actions">
        <label class="visually-hidden" for="currency">Currency</label>
        <select id="currency" class="select select-compact">
          <option value="INR">₹ INR</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="GBP">£ GBP</option>
          <option value="JPY">¥ JPY</option>
        </select>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch to dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div id="notice" class="notice" role="alert" hidden>
      <p id="noticeText"></p>
      <button id="noticeClose" class="icon-btn icon-btn-small" type="button" aria-label="Dismiss message">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <main class="layout">

      <!-- Summary -->
      <section class="card summary" aria-labelledby="periodLabel">
        <p id="periodLabel" class="summary-label">Spent this month</p>
        <p id="total" class="total">0</p>

        <div id="bar" class="bar" role="img" aria-label="Spending split by category"></div>
        <ul id="legend" class="legend"></ul>

        <dl class="stats">
          <div>
            <dt>Entries</dt>
            <dd id="count">0</dd>
          </div>
          <div>
            <dt>Largest category</dt>
            <dd id="topCategory">None yet</dd>
          </div>
        </dl>
      </section>

      <!-- Add / edit form -->
      <section class="card form-card" aria-labelledby="formTitle">
        <h2 id="formTitle" class="section-title">Add expense</h2>

        <form id="expenseForm" novalidate>
          <div class="field">
            <label for="title">What was it for?</label>
            <input id="title" name="title" type="text" maxlength="60" autocomplete="off" placeholder="Lunch, bus pass, electricity" aria-describedby="titleError">
            <p id="titleError" class="field-error" aria-live="polite"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="amount">Amount</label>
              <input id="amount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" aria-describedby="amountError">
              <p id="amountError" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" aria-describedby="dateError">
              <p id="dateError" class="field-error" aria-live="polite"></p>
            </div>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" class="select"></select>
          </div>

          <div class="form-actions">
            <button id="submitBtn" class="btn btn-primary" type="submit">Add expense</button>
            <button id="cancelBtn" class="btn btn-ghost" type="button" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <!-- List -->
      <section class="card list-card" aria-labelledby="listTitle">
        <div class="list-head">
          <h2 id="listTitle" class="section-title">Expenses</h2>
          <div class="filters">
            <div class="filter">
              <label class="visually-hidden" for="monthFilter">Month</label>
              <input id="monthFilter" type="month" class="select">
            </div>
            <button id="allTimeBtn" class="btn btn-ghost btn-small" type="button">All time</button>
            <div class="filter">
              <label class="visually-hidden" for="categoryFilter">Filter by category</label>
              <select id="categoryFilter" class="select"></select>
            </div>
          </div>
        </div>

        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden></p>

        <div class="list-foot">
          <button id="clearAll" class="btn btn-danger-text btn-small" type="button">Clear all data</button>
        </div>
      </section>

    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastAction" class="toast-action" type="button" hidden>Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
